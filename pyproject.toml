[project]
name = "sc4000"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lam.duonghoangvu", email = "lamthedev@proton.me" }
]
requires-python = ">=3.12"
# Runtime is Kaggle (Python 3.10, pycolmap 0.6.1 from imc2024-packages-lightglue-rerun-kornia);
# these are listed for local editing, linting and CPU smoke tests.
dependencies = [
    "h5py",
    "networkx",
    "numpy",
    "pandas",
    "pillow",
    "pycolmap",
    "torch",
    "tqdm",
    "transformers>=4.56",
    "lightglue @ git+https://github.com/cvg/LightGlue.git",
]

[project.scripts]
sc4000 = "sc4000:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
